[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pricing-hedging"
version = "0.1.0"
description = "Educational option pricing and hedging methods"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0", "matplotlib>=3.7", "ipykernel>=6.0", "nbclient>=0.10"]
test = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["pricing_hedging*"]
